[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel",
    "numpy>=1.15,<1.20; python_version<'3.12'",
    "numpy>=1.15; python_version>='3.12' and python_version<'3.13'",
    "numpy>=2.0; python_version>='3.13'",
    "Cython>=0.29.21,<0.30; python_version<'3.13'",
    "Cython>=3.0; python_version>='3.13'", 
    "versioneer>=0.29",
]
build-backend = "setuptools.build_meta"

[project]
name = "sklearn-contrib-py-earth"
description = "A Python implementation of Jerome Friedman's Multivariate Adaptive Regression Splines."
readme = "README.md"
license = {text = "BSD-3-Clause"}
# license-file = {file = "LICENSE.txt"}
requires-python = ">=3.6"
dynamic = ["version"]
authors = [
    { name = "Jason Rudy", email = "jcrudy@gmail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
dependencies = [
    "scipy>=0.16",
    "scikit-learn>=0.16",
    "six",
    "versioneer>=0.29",
]
# For Python 3.13 + NumPy 2, use: pip install -r requirements-py313.txt then pip install -e .

[project.optional-dependencies]
docs = ["sphinx_gallery"]
dev = ["cython"]
export = ["sympy"]
all_tests = ["pandas", "statsmodels", "patsy", "sympy"]

[project.urls]
Download = "https://github.com/scikit-learn-contrib/py-earth/archive/0.1.tar.gz"

[tool.setuptools]
packages = { find = {} }
include-package-data = true

# Cython extension list (same shape as [tool.setuptools] ext-modules).
# setup.py reads this, adds numpy include dir, and builds from .pyx via Cython.
[tool.pyearth]
ext-modules = [
  { name = "pyearth._util", sources = ["pyearth/_util.pyx"], include-dirs = ["pyearth"] },
  { name = "pyearth._basis", sources = ["pyearth/_basis.pyx"], include-dirs = ["pyearth"], extra-compile-args = ["-Wno-incompatible-pointer-types"] },
  { name = "pyearth._record", sources = ["pyearth/_record.pyx"], include-dirs = ["pyearth"] },
  { name = "pyearth._pruning", sources = ["pyearth/_pruning.pyx"], include-dirs = ["pyearth"] },
  { name = "pyearth._forward", sources = ["pyearth/_forward.pyx"], include-dirs = ["pyearth"] },
  { name = "pyearth._knot_search", sources = ["pyearth/_knot_search.pyx"], include-dirs = ["pyearth"] },
  { name = "pyearth._qr", sources = ["pyearth/_qr.pyx"], include-dirs = ["pyearth"] },
  { name = "pyearth._types", sources = ["pyearth/_types.pyx"], include-dirs = ["pyearth"] },
]

[tool.setuptools.dynamic]
version = { attr = "versioneer.get_version" }

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "pyearth/_version.py"
versionfile_build = "pyearth/_version.py"
tag_prefix = ""
parentdir_prefix = "py-earth"
