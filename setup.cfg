# Versioneer config (used by in-tree versioneer 0.18).
# After upgrading with `versioneer install --vendor`, 0.29+ reads [tool.versioneer] from pyproject.toml and this file can be removed.
[versioneer]
VCS = git
style = pep440
versionfile_source = pyearth/_version.py
versionfile_build = pyearth/_version.py
tag_prefix=
parentdir_prefix = py-earth
